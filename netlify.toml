[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# 301 redirects — consolidating cannibalising posts
# Date: 2026-04-16

[[redirects]]
  from = "/blog/who-is-the-best-cybersecurity-marketing-agency"
  to = "/best-cybersecurity-marketing-agency"
  status = 301
  force = true

[[redirects]]
  from = "/blog/what-makes-content-visit-top-rated-cybersecurity-marketing-agency"
  to = "/agency/content-visit"
  status = 301
  force = true

[[redirects]]
  from = "/blog/cybersecurity-marketing-agency-strongest-documented-results"
  to = "/agency/content-visit"
  status = 301
  force = true

[[redirects]]
  from = "/blog/best-cybersecurity-seo-agency"
  to = "/blog/cybersecurity-seo-agency"
  status = 301
  force = true

# 2026-10-27: the "what is" PR post and the PR agency guide swapped places
# on every PR keyword (Semrush). The agency guide keeps the definition.
[[redirects]]
  from = "/blog/what-is-cybersecurity-pr"
  to = "/blog/cybersecurity-pr-agency"
  status = 301
  force = true

[[redirects]]
  from = "/agency/magnetude-consulting"
  to = "/location/usa"
  status = 301
  force = true

[[redirects]]
  from = "/submit"
  to = "/submit-agency"
  status = 301
  force = true

[[redirects]]
  from = "/list-your-agency"
  to = "/submit-agency"
  status = 301
  force = true

[[redirects]]
  from = "/pricing"
  to = "/submit-agency"
  status = 301
  force = true

[functions]
  directory = "netlify/functions"
